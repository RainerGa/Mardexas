help.title=Hilfe – RichMarkDownEditor
help.header=Markdown und Bedienung
help.text=MARKDOWN-UNTERSTÜTZUNG\n\nDer Editor orientiert sich an GitHub Flavored Markdown (GFM), das auf CommonMark aufbaut. Er implementiert eine unterstützte Teilmenge und ist kein vollständiger CommonMark- oder GFM-Konformitätsprüfer.\nGFM-Spezifikation: https://github.github.com/gfm/\nCommonMark-Spezifikation: https://spec.commonmark.org/\n\nUnterstützt werden unter anderem Absätze und Leerzeilen, Überschriften (# bis ######), Fett, Kursiv, Durchgestrichen, Inline-Code, Links, Bilder, Aufzählungs- und Nummernlisten, verschachtelte Listen, Zitate, eingezäunte Codeblöcke, horizontale Trennlinien und GFM-Tabellen. Unterstreichung wird als HTML <u>-Element geschrieben und ist eine Erweiterung, kein Bestandteil des GFM-Kernumfangs.\n\nZEILEN- UND LEERZEILEN\n\nEin einzelner Zeilenumbruch zwischen normalen Textzeilen bleibt im Editor sichtbar und wird beim Speichern als einzelner Zeilenumbruch ausgegeben. Der Editor behandelt solche Zeilen intern als getrennte Absätze; andere Markdown-Renderer können einen einzelnen Umbruch gemäß GFM als weichen Umbruch darstellen.\n\nEine Leerzeile trennt Markdown-Blöcke. Mehrere aufeinanderfolgende leere Editorzeilen werden beim Speichern auf eine Markdown-Leerzeile zwischen den Blöcken normalisiert. Noch mehr Leerzeilen erzeugen in Markdown üblicherweise keinen größeren Abstand und werden deshalb nicht als zusätzliche vertikale Abstände bewahrt. Für größeren sichtbaren Abstand gibt es im Markdown-Format keine portable, standardisierte Absatzabstands-Notation.\n\nDATEIEN UND FORMATIERUNG\n\nMarkdown-Dateien werden als UTF-8 gelesen und geschrieben. Beim Lesen werden Windows- und klassische Mac-Zeilenenden normalisiert. Der Editor speichert unterstützte Formatierungen in Markdown; nicht unterstützte Syntax oder Quelltextformatierung kann beim Bearbeiten normalisiert werden. Für die bestmögliche Kompatibilität sollten Dateien mit den oben aufgeführten Elementen erstellt werden.
help.languages=SPRACHEN\n\nDie Benutzeroberfläche ist auf Deutsch, Englisch, Französisch, Spanisch, Portugiesisch (Brasilien), Japanisch, vereinfachtes Chinesisch, Italienisch, Koreanisch und Niederländisch verfügbar.
