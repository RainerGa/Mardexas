help.title=Aide – RichMarkDownEditor
help.header=Markdown et utilisation
help.text=PRISE EN CHARGE DE MARKDOWN\n\nL’éditeur suit GitHub Flavored Markdown (GFM), fondé sur CommonMark. Il prend en charge un sous-ensemble et ne vérifie pas entièrement la conformité à CommonMark ou GFM.\nSpécification GFM : https://github.github.com/gfm/\nSpécification CommonMark : https://spec.commonmark.org/\n\nLes fonctions prises en charge comprennent les paragraphes, les lignes vides, les titres (# à ######), le gras, l’italique, le barré, le code en ligne, les liens, les images, les listes à puces et numérotées, les listes imbriquées, les citations, les blocs de code clôturés, les lignes horizontales et les tableaux GFM. Le soulignement est écrit sous forme d’élément HTML <u> et constitue une extension, pas une partie du cœur de GFM.\n\nSAUTS DE LIGNE ET LIGNES VIDES\n\nUn saut de ligne simple entre des lignes de texte ordinaires reste visible dans l’éditeur et est enregistré comme un saut de ligne simple. L’éditeur traite ces lignes comme des paragraphes distincts ; d’autres moteurs Markdown peuvent afficher un saut simple comme un retour à la ligne souple selon GFM.\n\nUne ligne vide sépare les blocs Markdown. Lors de l’enregistrement, plusieurs lignes vides consécutives sont normalisées en une seule ligne vide entre les blocs. Les lignes vides supplémentaires ne créent généralement pas davantage d’espace en Markdown et ne sont donc pas conservées comme espacement vertical supplémentaire. Markdown ne définit pas de notation portable et standardisée pour un espacement accru entre paragraphes.\n\nFICHIERS ET MISE EN FORME\n\nLes fichiers Markdown sont lus et écrits en UTF-8. Les fins de ligne Windows et Mac classique sont normalisées à la lecture. L’éditeur enregistre les mises en forme prises en charge ; une syntaxe ou une mise en forme source non prise en charge peut être normalisée lors de l’édition. Pour une meilleure compatibilité, utilisez les éléments indiqués ci-dessus.
help.languages=LANGUES\n\nL’interface est disponible en allemand, anglais, français, espagnol, portugais (Brésil), japonais, chinois simplifié, italien, coréen et néerlandais.
about.title=À propos de RichMarkDownEditor
about.header=Version 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nUn éditeur Markdown WYSIWYG pour JavaFX.\n\nLicence de l’application : GNU General Public License, version 3 (GPL-3.0).\n\nBibliothèques d’exécution :\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls et Graphics.\n\nBibliothèques de test (développement et tests uniquement) :\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon et OpenJFX Monocle 21.0.2\n\nNous remercions chaleureusement l’équipe Gluon et tous les contributeurs de Rich Text Area, ainsi que les développeurs d’OpenJFX. Nous remercions également les équipes et contributeurs de JUnit et TestFX. Leurs logiciels libres et leur travail rendent ce projet possible. Consultez les mentions de licence dans Aide → Licences.
