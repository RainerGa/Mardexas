license.text=애플리케이션 라이선스\n\nRichMarkDownEditor는 GNU General Public License 버전 3 (GPL-3.0)에 따라 라이선스가 부여됩니다. 이 라이선스는 프로젝트의 애플리케이션 코드에 적용됩니다.\n전체 라이선스: https://www.gnu.org/licenses/gpl-3.0.html\n\n사용 구성 요소의 라이선스\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls 및 Graphics)\nClasspath Exception이 적용된 GPL-2.0-only.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\n개발 및 테스트 종속성:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – 사용된 아티팩트 메타데이터에 따른 European Union Public Licence 1.1 (EUPL-1.1).\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – Classpath Exception이 적용된 GPL-2.0-only (테스트 종속성).\nhttps://openjdk.org/legal/gplv2+ce.html\n\n재배포\n\n편집기를 재배포할 때는 GPL-3.0 조건과 포함된 모든 구성 요소의 라이선스 조건을 준수해야 합니다. 특히 수정 사항을 포함한 완전한 해당 소스 코드와 라이선스 문서 및 저작권 고지 사본을 제공해야 합니다.\n\n이 고지는 정보 제공 목적이며 법률 자문이 아니고 특정 배포 방식이 모든 조건을 충족한다고 보장하지 않습니다. 게시 또는 재배포 전에 전체 라이선스 문서, 정확한 아티팩트 및 배포 방식을 확인하세요. 링크된 라이선스 문서가 기준이 됩니다.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
