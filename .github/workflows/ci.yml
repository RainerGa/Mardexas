name: CI

on:
  push:
    branches: [ main, Packaging_and_IntegrationAPI ]
  pull_request:
    branches: [ main, Packaging_and_IntegrationAPI ]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (Java ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025, macos-15, macos-15-intel ]
        java-version: [ 25 ]
    steps:
      - name: Check out source und pinned RichTextArea-Fork
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Java einrichten
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Tests ausführen
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-java-${{ matrix.java-version }}
          path: |
            emoji-noto/target/surefire-reports/
            rich-text-area/rta/target/surefire-reports/
            editor/target/surefire-reports/
            integration-demos/target/surefire-reports/
          if-no-files-found: warn

      - name: Linux checkout script tests
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/checkout-linux.sh
          python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Release checks testen
        run: python3 -B -m unittest discover -s packaging -p 'test_*.py'

      - name: Icon-Herkunft und Lizenzprüfung testen
        run: |
          python3 -B -m unittest discover -s packaging -p test_audit_icons.py
          python3 packaging/audit-icons.py
          python3 -B -m unittest discover -s packaging -p test_audit_emoji.py
          python3 packaging/audit-emoji.py
