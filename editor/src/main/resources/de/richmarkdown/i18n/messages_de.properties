license.text=LIZENZ DER ANWENDUNG\n\nRichMarkDownEditor ist unter der GNU General Public License, Version 3 (GPL-3.0), lizenziert. Diese Lizenz gilt für den Anwendungscode dieses Projekts.\nVollständiger Lizenztext: https://www.gnu.org/licenses/gpl-3.0.html\n\nLIZENZEN DER VERWENDETEN KOMPONENTEN\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls und Graphics)\nGPL-2.0-only mit Classpath Exception.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\nEntwicklungs- und Testabhängigkeiten:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – European Union Public Licence 1.1 (EUPL-1.1), gemäß den Metadaten der verwendeten Artefakte.\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only mit Classpath Exception (Testabhängigkeit).\nhttps://openjdk.org/legal/gplv2+ce.html\n\nWEITERGABE\n\nBei einer Weitergabe des Editors müssen die GPL-3.0-Bedingungen sowie die Bedingungen aller mitgelieferten Komponenten eingehalten werden. Dazu gehören insbesondere die Bereitstellung des vollständigen korrespondierenden Quellcodes einschließlich Änderungen sowie Kopien der Lizenztexte und Copyright-Hinweise.\n\nDiese Anzeige ist ein Hinweis, keine Rechtsberatung und keine Garantie, dass ein beliebiges Distributionsmodell alle Bedingungen erfüllt. Vor einer Veröffentlichung oder Weitergabe bitte die vollständigen Lizenztexte, die konkreten Artefakte und die Distributionsform prüfen. Die in den Links genannten Lizenztexte sind maßgeblich.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
