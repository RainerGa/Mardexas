help.title=ヘルプ – RichMarkDownEditor
help.header=Markdown と使い方
help.text=MARKDOWN のサポート\n\nこのエディターは CommonMark を基盤とする GitHub Flavored Markdown (GFM) に準拠しています。サポート対象は一部であり、CommonMark または GFM への完全な準拠を検証するものではありません。\nGFM 仕様: https://github.github.com/gfm/\nCommonMark 仕様: https://spec.commonmark.org/\n\n段落と空行、見出し (# から ######)、太字、斜体、取り消し線、インラインコード、リンク、画像、箇条書きと番号付きリスト、入れ子リスト、引用、フェンス付きコードブロック、水平線、GFM テーブルなどをサポートします。下線は HTML の <u> 要素として出力される拡張機能であり、GFM の中核仕様には含まれません。\n\n改行と空行\n\n通常のテキスト行の間にある単一の改行はエディターに表示され、単一の改行として保存されます。エディター内部では別々の段落として扱います。他の Markdown レンダラーでは、GFM に従って単一改行がソフト改行として表示される場合があります。\n\n空行は Markdown ブロックを区切ります。連続した複数の空行は、保存時にブロック間の 1 つの空行に正規化されます。Markdown では空行を増やしても通常は間隔が広がらないため、追加の空行は縦方向の余白として保持されません。段落間隔を広げるための、移植可能で標準化された Markdown 記法はありません。\n\nファイルと書式\n\nMarkdown ファイルは UTF-8 で読み書きされます。読み込み時に Windows および旧 Mac の改行コードは正規化されます。サポートされる書式は Markdown として保存されます。サポート外の構文やソース書式は編集時に正規化される場合があります。互換性を高めるには、上記の要素を使用してください。
help.languages=言語\n\nインターフェースはドイツ語、英語、フランス語、スペイン語、ブラジルポルトガル語、日本語、中国語（簡体字）、イタリア語、韓国語、オランダ語で利用できます。
about.title=RichMarkDownEditor について
about.header=バージョン 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nJavaFX 向けの WYSIWYG Markdown エディターです。\n\nアプリケーションライセンス: GNU General Public License バージョン 3 (GPL-3.0)。\n\n実行時ライブラリ:\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls および Graphics。\n\nテストライブラリ (開発とテストのみ):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon および OpenJFX Monocle 21.0.2\n\nRich Text Area の Gluon チームとすべての貢献者、OpenJFX の開発者に心より感謝します。また、JUnit と TestFX の各チームおよび貢献者にも感謝します。皆さまの自由ソフトウェアと活動によってこのプロジェクトが実現しています。ヘルプ → ライセンスでライセンス表記をご確認ください。
license.title=ライセンス
license.header=ライセンスとサードパーティコンポーネントの表記
license.text=アプリケーションライセンス\n\nRichMarkDownEditor は GNU General Public License バージョン 3 (GPL-3.0) の下でライセンスされています。このライセンスは本プロジェクトのアプリケーションコードに適用されます。\nライセンス全文: https://www.gnu.org/licenses/gpl-3.0.html\n\n使用コンポーネントのライセンス\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls および Graphics)\nClasspath Exception 付き GPL-2.0-only。\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\n開発およびテスト依存関係:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – 使用アーティファクトのメタデータに基づく European Union Public Licence 1.1 (EUPL-1.1)。\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – Classpath Exception 付き GPL-2.0-only (テスト依存関係)。\nhttps://openjdk.org/legal/gplv2+ce.html\n\n再配布\n\nエディターを再配布する場合、GPL-3.0 の条件および同梱するすべてのコンポーネントのライセンス条件に従う必要があります。特に、変更を含む完全な対応ソースコードと、ライセンステキストおよび著作権表示のコピーを提供する必要があります。\n\nこの表示は情報提供を目的とし、法的助言ではありません。また、特定の配布方法がすべての条件を満たすことを保証するものではありません。公開または再配布の前に、ライセンス全文、実際のアーティファクト、配布形態をご確認ください。リンク先のライセンス本文が優先されます。\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md

