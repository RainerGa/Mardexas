name: Submit complete Maven dependency graph

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The fork and offline emojis are source modules, not Central artifacts.
      # Install the exact pinned sources before resolving the dependency graph.
      - name: Install reactor artifacts for dependency resolution
        run: mvn -B -ntp -Dmaven.test.skip=true -Djacoco.skip=true install
      - name: Submit dependencies including the pinned fork
        uses: actions/maven-dependency-submission-action@1f666f7ac2ab7b72cd5e22eaf7f23c8a581db1db
