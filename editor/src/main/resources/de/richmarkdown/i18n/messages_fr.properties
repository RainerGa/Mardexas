license.text=LICENCE DE L’APPLICATION\n\nRichMarkDownEditor est distribué sous GNU General Public License, version 3 (GPL-3.0). Cette licence s’applique au code de l’application.\nTexte intégral : https://www.gnu.org/licenses/gpl-3.0.html\n\nLICENCES DES COMPOSANTS UTILISÉS\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls et Graphics)\nGPL-2.0-only avec l’exception Classpath.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\nDépendances de développement et de test :\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – European Union Public Licence 1.1 (EUPL-1.1), selon les métadonnées des artefacts utilisés.\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only avec exception Classpath (dépendance de test).\nhttps://openjdk.org/legal/gplv2+ce.html\n\nREDISTRIBUTION\n\nLa redistribution de l’éditeur doit respecter la GPL-3.0 et les licences de tous les composants inclus. Cela comprend notamment la fourniture du code source correspondant complet, modifications incluses, ainsi que des copies des textes de licence et avis de droit d’auteur.\n\nCette notice est informative et ne constitue pas un conseil juridique ni une garantie de conformité d’un mode de distribution particulier. Avant toute publication ou redistribution, vérifiez les textes de licence complets, les artefacts exacts et le mode de distribution. Les textes accessibles par les liens font foi.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
