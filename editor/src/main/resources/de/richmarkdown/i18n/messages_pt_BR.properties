license.text=LICENÇA DO APLICATIVO\n\nO RichMarkDownEditor é licenciado sob a GNU General Public License, versão 3 (GPL-3.0). Esta licença se aplica ao código do aplicativo.\nTexto completo: https://www.gnu.org/licenses/gpl-3.0.html\n\nLICENÇAS DOS COMPONENTES UTILIZADOS\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls e Graphics)\nGPL-2.0-only com Classpath Exception.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\nDependências de desenvolvimento e teste:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – European Union Public Licence 1.1 (EUPL-1.1), conforme os metadados dos artefatos utilizados.\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only com Classpath Exception (dependência de teste).\nhttps://openjdk.org/legal/gplv2+ce.html\n\nREDISTRIBUIÇÃO\n\nA redistribuição do editor deve cumprir as condições da GPL-3.0 e as licenças de todos os componentes incluídos. Isso inclui, em particular, fornecer o código-fonte correspondente completo, incluindo alterações, e cópias dos textos de licença e avisos de direitos autorais.\n\nEste aviso é informativo, não constitui aconselhamento jurídico e não garante que um modelo específico de distribuição cumpra todas as condições. Antes de publicar ou redistribuir, verifique os textos completos das licenças, os artefatos exatos e o modelo de distribuição. Os textos nos links são os documentos oficiais.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
