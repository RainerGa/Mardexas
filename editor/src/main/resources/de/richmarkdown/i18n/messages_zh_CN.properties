help.title=帮助 – RichMarkDownEditor
help.header=Markdown 与使用说明
help.text=MARKDOWN 支持\n\n编辑器遵循基于 CommonMark 的 GitHub Flavored Markdown (GFM)。它实现了受支持的子集，并非完整的 CommonMark 或 GFM 一致性检查器。\nGFM 规范：https://github.github.com/gfm/\nCommonMark 规范：https://spec.commonmark.org/\n\n支持段落和空行、标题（# 到 ######）、粗体、斜体、删除线、行内代码、链接、图片、项目符号列表和编号列表、嵌套列表、引用、围栏代码块、水平线及 GFM 表格。下划线会写为 HTML <u> 元素，属于扩展功能，并非 GFM 核心规范的一部分。\n\n换行与空行\n\n普通文本行之间的单个换行会在编辑器中保留，并在保存时写为单个换行。编辑器内部将这些行视为不同段落；其他 Markdown 渲染器可能按照 GFM 将单个换行显示为软换行。\n\n空行用于分隔 Markdown 块。保存时，连续的多个空编辑器行会规范化为块之间的一个 Markdown 空行。更多空行通常不会在 Markdown 中产生更大的间距，因此不会作为额外垂直间距保留。Markdown 没有可移植且标准化的段落间距语法。\n\n文件与格式\n\nMarkdown 文件以 UTF-8 读取和写入。读取时会规范化 Windows 和经典 Mac 换行符。编辑器会将支持的格式保存为 Markdown；不支持的语法或源格式可能在编辑时被规范化。为获得最佳兼容性，请使用上述元素。
help.languages=语言\n\n界面现支持德语、英语、法语、西班牙语、巴西葡萄牙语、日语、简体中文、意大利语、韩语和荷兰语。
about.title=关于 RichMarkDownEditor
about.header=版本 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\n适用于 JavaFX 的所见即所得 Markdown 编辑器。\n\n应用许可证：GNU General Public License 第 3 版 (GPL-3.0)。\n\n运行时库：\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls 和 Graphics。\n\n测试库（仅用于开发和测试）：\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon 和 OpenJFX Monocle 21.0.2\n\n我们衷心感谢 Gluon 团队、Rich Text Area 的所有贡献者以及 OpenJFX 开发者。我们也感谢 JUnit 和 TestFX 团队及贡献者。他们的自由软件和辛勤工作让本项目成为可能。请参阅“帮助 → 许可证”中的许可声明。
