name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to update, for example v1.0.0"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  verify:
    name: Unit tests, GUI contracts and static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify application and packaging tests
        run: |
          mvn --batch-mode --no-transfer-progress verify
          python3 -B -m unittest discover -s packaging -p 'test_*.py'
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-evidence
          path: |
            editor/target/surefire-reports/
            editor/target/site/jacoco/
            integration-demos/target/surefire-reports/
          if-no-files-found: warn

  linux:
    needs: verify
    name: Linux portable and Flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and pinned RichTextArea fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Determine release version
        id: version
        shell: bash
        run: |
          pom_version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' editor/pom.xml | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$pom_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tags must use numeric versions such as v1.2.3." >&2
            exit 1
          fi
          if [[ "$version" != "$pom_version" ]]; then
            echo "Release tag version ($version) must match editor/pom.xml version ($pom_version)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Linux application image
        env:
          JAVAFX_PLATFORM: linux
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: packaging/build-app-image.sh

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Build Linux DEB and RPM installers
        env:
          JAVAFX_PLATFORM: linux
        run: packaging/build-installers.sh

      - name: Create portable Linux archive
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tar -C dist/linux -czf "dist/Mardexas-${APP_VERSION}-linux-x86_64-portable.tar.gz" Mardexas

      - name: Prepare Flatpak source tree
        run: |
          mkdir -p dist/flatpak-source/flatpak dist/flatpak-source/app
          cp -a dist/linux/Mardexas/. dist/flatpak-source/app/
          cp packaging/flatpak/mardexas dist/flatpak-source/flatpak/
          cp packaging/flatpak/io.github.rainerga.Mardexas.desktop dist/flatpak-source/flatpak/
          cp packaging/flatpak/io.github.rainerga.Mardexas.svg dist/flatpak-source/flatpak/
          cp packaging/flatpak/io.github.rainerga.Mardexas.metainfo.xml dist/flatpak-source/flatpak/

      - name: Install Flatpak build tools and runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          dbus-run-session -- bash -euc '
            flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
            flatpak install --user --assumeyes flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          '

      - name: Build Flatpak bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          dbus-run-session -- flatpak-builder --user --force-clean \
            --repo=dist/flatpak-repo \
            dist/flatpak-build \
            packaging/flatpak/io.github.rainerga.Mardexas.yml
          dbus-run-session -- flatpak build-bundle \
            dist/flatpak-repo \
            "dist/Mardexas-${APP_VERSION}-linux-x86_64.flatpak" \
            io.github.rainerga.Mardexas

      - name: Verify actual Flatpak runtime GUI and readable font samples
        run: |
          dbus-run-session -- python3 packaging/verify-package.py flatpak \
            --input-dir editor/target/jpackage-input --output-dir editor/target/flatpak-check \
            --platform linux --executable dist/flatpak-build

      - name: Build integration library, Javadoc, demos and complete command reference
        run: bash packaging/build-library.sh

      - name: Create source archive including submodule contents
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 packaging/source-archive.py "dist/Mardexas-${APP_VERSION}-source.tar.gz"

      - name: Upload Linux and source release assets
        uses: actions/upload-artifact@v4
        with:
          name: mardexas-linux
          path: |
            dist/Mardexas-*-linux-x86_64-portable.tar.gz
            dist/Mardexas-*-linux-x86_64.deb
            dist/Mardexas-*-linux-x86_64.rpm
            dist/Mardexas-*-linux-x86_64.flatpak
            dist/Mardexas-*-source.tar.gz
            dist/Mardexas-*-library.zip
          if-no-files-found: error

      - name: Retain GUI and font evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-linux
          path: |
            editor/target/portable-check/linux/
            editor/target/flatpak-check/
          if-no-files-found: warn

  windows:
    needs: verify
    name: Windows MSI and portable ZIP
    runs-on: windows-2025
    steps:
      - name: Check out source and pinned RichTextArea fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Determine release version
        id: version
        shell: bash
        run: |
          pom_version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' editor/pom.xml | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$pom_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tags must use numeric versions such as v1.2.3." >&2
            exit 1
          fi
          if [[ "$version" != "$pom_version" ]]; then
            echo "Release tag version ($version) must match editor/pom.xml version ($pom_version)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows application image
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          JAVAFX_PLATFORM: win
        run: |
          packaging/build-app-image.sh

      - name: Create portable Windows ZIP
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist/win/Mardexas -DestinationPath "dist/Mardexas-$env:APP_VERSION-windows-x86_64-portable.zip" -Force

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v*" -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if (-not $wix) { throw "WiX Toolset installation directory was not found." }
            "$($wix.FullName)\bin" >> $env:GITHUB_PATH
          }

      - name: Build Windows MSI and EXE installers
        shell: bash
        env:
          JAVAFX_PLATFORM: win
        run: packaging/build-installers.sh

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: mardexas-windows
          path: |
            dist/Mardexas-*-windows-x86_64-portable.zip
            dist/Mardexas-*-windows-x86_64.msi
            dist/Mardexas-*-windows-x86_64.exe
          if-no-files-found: error

      - name: Retain GUI and font evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-windows
          path: editor/target/portable-check/win/
          if-no-files-found: warn

  macos:
    needs: verify
    name: macOS portable and installers (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: aarch64
    steps:
      - name: Check out source and pinned RichTextArea fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Determine release version and architecture
        id: version
        shell: bash
        run: |
          pom_version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' editor/pom.xml | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$pom_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tags must use numeric versions such as v1.2.3." >&2
            exit 1
          fi
          if [[ "$version" != "$pom_version" ]]; then
            echo "Release tag version ($version) must match editor/pom.xml version ($pom_version)." >&2
            exit 1
          fi
          case "$(uname -m)" in
            arm64|aarch64)
              platform="mac-aarch64"
              architecture="aarch64"
              ;;
            x86_64)
              platform="mac"
              architecture="x86_64"
              ;;
            *)
              echo "Unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"

      - name: Build macOS application image
        env:
          JAVAFX_PLATFORM: ${{ steps.version.outputs.platform }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: packaging/build-app-image.sh

      - name: Build macOS DMG and PKG installers
        env:
          JAVAFX_PLATFORM: ${{ steps.version.outputs.platform }}
        run: packaging/build-installers.sh

      - name: Create portable macOS ZIP
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          ARCHITECTURE: ${{ steps.version.outputs.architecture }}
        run: |
          archive="dist/Mardexas-${APP_VERSION}-macos-${ARCHITECTURE}-portable.zip"
          app_dir="dist/${{ steps.version.outputs.platform }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir/Mardexas.app" "$archive"
          zip -q -j "$archive" \
            "$app_dir/Mardexas-GPL-3.0.txt" \
            "$app_dir/RichTextArea-GPL-3.0.txt" \
            "$app_dir/THIRD-PARTY-NOTICES.md"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: mardexas-macos-${{ matrix.architecture }}
          path: |
            dist/Mardexas-*-macos-*-portable.zip
            dist/Mardexas-*-macos-*.dmg
            dist/Mardexas-*-macos-*.pkg
          if-no-files-found: error

      - name: Retain GUI and font evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-macos-${{ matrix.architecture }}
          path: editor/target/portable-check/${{ steps.version.outputs.platform }}/
          if-no-files-found: warn

  fat-jar:
    needs: verify
    name: Executable FAT JAR (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: windows-2025
            label: windows-x86_64
          - runner: macos-15-intel
            label: macos-x86_64
          - runner: macos-15
            label: macos-aarch64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source and pinned RichTextArea fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Determine release version
        id: version
        shell: bash
        run: |
          pom_version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' editor/pom.xml | head -n1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$pom_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tags must use numeric versions such as v1.2.3." >&2
            exit 1
          fi
          if [[ "$version" != "$pom_version" ]]; then
            echo "Release tag version ($version) must match editor/pom.xml version ($pom_version)." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build executable FAT JAR
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: packaging/build-fat-jar.sh

      - name: Upload FAT JAR release asset
        uses: actions/upload-artifact@v4
        with:
          name: mardexas-fat-jar-${{ matrix.label }}
          path: dist/Mardexas-*-fat.jar
          if-no-files-found: error

      - name: Retain GUI and font evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence-fat-${{ matrix.label }}
          path: editor/target/fat-check/
          if-no-files-found: warn

  native-image:
    needs: verify
    name: Native image (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            label: linux-x86_64
            distribution: graalvm-community
          - runner: windows-2025
            platform: win
            label: windows-x86_64
            distribution: graalvm-community
          - runner: macos-15
            platform: mac-aarch64
            label: macos-aarch64
            distribution: graalvm-community
          # GraalVM 25 dropped macOS Intel. Liberica NIK retains this target.
          - runner: macos-15-intel
            platform: mac
            label: macos-x86_64
            distribution: liberica
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.2'
          distribution: ${{ matrix.distribution }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Install Linux GUI build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libz-dev libgtk-3-0t64 xvfb xauth libfreetype6 fontconfig
      - name: Validate release version
        env:
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
        run: |
          version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' editor/pom.xml | head -n1)"
          requested="$REQUESTED_RELEASE"
          [[ "$GITHUB_REF" != refs/tags/v* ]] || requested="$GITHUB_REF_NAME"
          [[ -z "$requested" || "${requested#v}" == "$version" ]] || exit 2
      - name: Build and verify native GUI and fonts
        env:
          JAVAFX_PLATFORM: ${{ matrix.platform }}
        run: packaging/build-native-image.sh
      - name: Archive native executable and all notices
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_LABEL: ${{ matrix.label }}
        run: |
          version="$(sed -n 's/^[[:space:]]*<version>\([^<]*\)<\/version>[[:space:]]*$/\1/p' editor/pom.xml | head -n1)"
          tar -C "dist/native/$TARGET_PLATFORM" -czf "dist/Mardexas-$version-$TARGET_LABEL-native.tar.gz" .
      - name: Upload native release asset
        uses: actions/upload-artifact@v4
        with:
          name: mardexas-native-${{ matrix.label }}
          path: dist/Mardexas-*-native.tar.gz
          if-no-files-found: error
      - name: Retain rendering evidence and build traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-check-${{ matrix.label }}
          path: editor/target/package-check/
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub release with packages
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs:
      - linux
      - windows
      - macos
      - fat-jar
      - native-image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out inventory validator
        uses: actions/checkout@v4

      - name: Set up reproducible Python tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: mardexas-*
          path: dist
          merge-multiple: true
      - name: Validate release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          source_archive="$(find dist -maxdepth 1 -type f -name 'Mardexas-*-source.tar.gz' -print -quit)"
          if [[ -z "$source_archive" ]]; then
            echo "Source archive is missing from downloaded release assets." >&2
            exit 1
          fi
          asset_version="${source_archive##*/Mardexas-}"
          asset_version="${asset_version%-source.tar.gz}"
          if [[ "$tag_version" != "$asset_version" ]]; then
            echo "Release tag version ($tag_version) does not match package version ($asset_version)." >&2
            exit 1
          fi
      - name: Require every target and generate checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python3 packaging/release-inventory.py dist "$RELEASE_TAG"
      - name: Publish release with packages and source
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: ${{ inputs.release_tag == '' }}
          overwrite_files: true
          files: dist/*
          fail_on_unmatched_files: true
