help.title=Guida – RichMarkDownEditor
help.header=Markdown e utilizzo
help.text=SUPPORTO MARKDOWN\n\nL’editor segue GitHub Flavored Markdown (GFM), basato su CommonMark. Implementa un sottoinsieme supportato e non verifica completamente la conformità a CommonMark o GFM.\nSpecifiche GFM: https://github.github.com/gfm/\nSpecifiche CommonMark: https://spec.commonmark.org/\n\nSono supportati paragrafi e righe vuote, titoli (#–######), grassetto, corsivo, barrato, codice in linea, link, immagini, elenchi puntati e numerati, elenchi annidati, citazioni, blocchi di codice delimitati, linee orizzontali e tabelle GFM. La sottolineatura viene scritta come elemento HTML <u> ed è un’estensione, non parte del nucleo GFM.\n\nINTERRUZIONI DI RIGA E RIGHE VUOTE\n\nUna singola interruzione tra righe di testo normale rimane visibile nell’editor e viene salvata come interruzione singola. L’editor tratta queste righe come paragrafi separati; altri renderer Markdown possono visualizzare un’interruzione singola come ritorno a capo morbido secondo GFM.\n\nUna riga vuota separa i blocchi Markdown. Al salvataggio, più righe vuote consecutive vengono normalizzate a una sola riga vuota tra i blocchi. Le righe vuote aggiuntive di norma non creano ulteriore spazio in Markdown e non vengono quindi conservate come spaziatura verticale extra. Markdown non dispone di una notazione portabile e standardizzata per aumentare lo spazio tra paragrafi.\n\nFILE E FORMATTAZIONE\n\nI file Markdown vengono letti e scritti in UTF-8. Le terminazioni di riga Windows e Mac classico vengono normalizzate durante la lettura. L’editor salva le formattazioni supportate; sintassi o formattazioni sorgente non supportate possono essere normalizzate durante la modifica. Per la massima compatibilità, usa gli elementi elencati sopra.
help.languages=LINGUE\n\nL’interfaccia è disponibile in tedesco, inglese, francese, spagnolo, portoghese (Brasile), giapponese, cinese semplificato, italiano, coreano e olandese.
about.title=Informazioni su RichMarkDownEditor
about.header=Versione 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nUn editor Markdown WYSIWYG per JavaFX.\n\nLicenza dell’applicazione: GNU General Public License, versione 3 (GPL-3.0).\n\nLibrerie runtime:\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls e Graphics.\n\nLibrerie di test (solo sviluppo e test):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon e OpenJFX Monocle 21.0.2\n\nRingraziamo di cuore il team Gluon e tutti i collaboratori di Rich Text Area, insieme agli sviluppatori OpenJFX. Ringraziamo anche i team e i collaboratori di JUnit e TestFX. Il loro software libero e il loro lavoro rendono possibile questo progetto. Consulta le note di licenza in Aiuto → Licenze.
license.title=Licenze
license.header=Licenze e avvisi sui componenti di terze parti
license.text=LICENZA DELL’APPLICAZIONE\n\nRichMarkDownEditor è distribuito secondo la GNU General Public License, versione 3 (GPL-3.0). Questa licenza si applica al codice dell’applicazione.\nTesto completo: https://www.gnu.org/licenses/gpl-3.0.html\n\nLICENZE DEI COMPONENTI UTILIZZATI\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls e Graphics)\nGPL-2.0-only con Classpath Exception.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\nDipendenze di sviluppo e test:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – European Union Public Licence 1.1 (EUPL-1.1), secondo i metadati degli artefatti utilizzati.\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only con Classpath Exception (dipendenza di test).\nhttps://openjdk.org/legal/gplv2+ce.html\n\nRIDISTRIBUZIONE\n\nLa ridistribuzione dell’editor deve rispettare le condizioni GPL-3.0 e le licenze di tutti i componenti inclusi. Ciò comprende in particolare la fornitura del codice sorgente corrispondente completo, incluse le modifiche, e delle copie dei testi di licenza e degli avvisi di copyright.\n\nQuesto avviso è informativo, non costituisce consulenza legale e non garantisce che uno specifico modello di distribuzione soddisfi tutte le condizioni. Prima della pubblicazione o ridistribuzione, verifica i testi completi delle licenze, gli artefatti esatti e il modello di distribuzione. Fanno fede i testi ai link indicati.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
