help.title=Ajuda – RichMarkDownEditor
help.header=Markdown e uso
help.text=SUPORTE A MARKDOWN\n\nO editor segue o GitHub Flavored Markdown (GFM), baseado no CommonMark. Ele implementa um subconjunto compatível e não verifica completamente a conformidade com CommonMark ou GFM.\nEspecificação GFM: https://github.github.com/gfm/\nEspecificação CommonMark: https://spec.commonmark.org/\n\nOs recursos incluem parágrafos e linhas em branco, títulos (# a ######), negrito, itálico, tachado, código em linha, links, imagens, listas com marcadores e numeradas, listas aninhadas, citações, blocos de código delimitados, linhas horizontais e tabelas GFM. O sublinhado é escrito como elemento HTML <u> e é uma extensão, não faz parte do núcleo do GFM.\n\nQUEBRAS DE LINHA E LINHAS EM BRANCO\n\nUma quebra de linha entre linhas de texto comuns continua visível no editor e é salva como uma quebra simples. O editor trata essas linhas como parágrafos separados; outros renderizadores Markdown podem exibir uma quebra simples como uma quebra suave, conforme o GFM.\n\nUma linha em branco separa blocos Markdown. Ao salvar, várias linhas vazias consecutivas são normalizadas para uma linha em branco entre blocos. Linhas vazias adicionais geralmente não criam mais espaçamento em Markdown e, por isso, não são preservadas como espaçamento vertical extra. Markdown não define uma notação portátil e padronizada para aumentar o espaçamento entre parágrafos.\n\nARQUIVOS E FORMATAÇÃO\n\nArquivos Markdown são lidos e gravados em UTF-8. Finais de linha do Windows e do Mac clássico são normalizados na leitura. O editor salva formatações compatíveis; sintaxe ou formatação de origem não compatível pode ser normalizada durante a edição. Para melhor compatibilidade, use os elementos listados acima.
help.languages=IDIOMAS\n\nA interface está disponível em alemão, inglês, francês, espanhol, português (Brasil), japonês, chinês simplificado, italiano, coreano e holandês.
about.title=Sobre o RichMarkDownEditor
about.header=Versão 1.1.0
about.text=RichMarkDownEditor 1.1.0\n\nUm editor Markdown WYSIWYG para JavaFX.\n\nLicença do aplicativo: GNU General Public License, versão 3 (GPL-3.0).\n\nBibliotecas de execução:\n• RichTextArea fork 3.5-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls e Graphics.\n\nBibliotecas de teste (somente desenvolvimento e testes):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon e OpenJFX Monocle 21.0.2\n\nAgradecemos sinceramente à equipe Gluon e a todos os colaboradores do Rich Text Area, bem como aos desenvolvedores do OpenJFX. Também agradecemos às equipes e aos colaboradores do JUnit e do TestFX. O software livre e o trabalho dessas comunidades tornam este projeto possível. Consulte os avisos de licença em Ajuda → Licenças.
