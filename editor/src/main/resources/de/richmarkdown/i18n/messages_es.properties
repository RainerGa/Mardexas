help.title=Ayuda – RichMarkDownEditor
help.header=Markdown y uso
help.text=COMPATIBILIDAD CON MARKDOWN\n\nEl editor sigue GitHub Flavored Markdown (GFM), basado en CommonMark. Implementa un subconjunto compatible y no comprueba completamente la conformidad con CommonMark o GFM.\nEspecificación GFM: https://github.github.com/gfm/\nEspecificación CommonMark: https://spec.commonmark.org/\n\nIncluye párrafos y líneas en blanco, encabezados (# a ######), negrita, cursiva, tachado, código en línea, enlaces, imágenes, listas con viñetas y numeradas, listas anidadas, citas, bloques de código delimitados, líneas horizontales y tablas GFM. El subrayado se escribe como elemento HTML <u> y es una extensión, no parte del núcleo de GFM.\n\nSALTOS DE LÍNEA Y LÍNEAS EN BLANCO\n\nUn salto de línea entre líneas de texto normal permanece visible en el editor y se guarda como un salto de línea. El editor trata esas líneas como párrafos independientes; otros procesadores Markdown pueden mostrar un salto simple como salto suave según GFM.\n\nUna línea en blanco separa bloques Markdown. Al guardar, varias líneas vacías consecutivas se normalizan a una línea en blanco entre bloques. Las líneas vacías adicionales normalmente no crean más espacio en Markdown y no se conservan como separación vertical adicional. Markdown no tiene una notación portátil y estándar para aumentar el espacio entre párrafos.\n\nARCHIVOS Y FORMATO\n\nLos archivos Markdown se leen y escriben en UTF-8. Al leer, se normalizan los finales de línea de Windows y Mac clásico. El editor guarda los formatos compatibles; la sintaxis o formato de origen no compatible puede normalizarse al editar. Para obtener la mejor compatibilidad, use los elementos indicados arriba.
help.languages=IDIOMAS\n\nLa interfaz está disponible en alemán, inglés, francés, español, portugués (Brasil), japonés, chino simplificado, italiano, coreano y neerlandés.
about.title=Acerca de RichMarkDownEditor
about.header=Versión 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nUn editor Markdown WYSIWYG para JavaFX.\n\nLicencia de la aplicación: GNU General Public License, versión 3 (GPL-3.0).\n\nBibliotecas de ejecución:\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4: JavaFX Controls y Graphics.\n\nBibliotecas de prueba (solo desarrollo y pruebas):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon y OpenJFX Monocle 21.0.2\n\nNuestro sincero agradecimiento al equipo de Gluon y a todas las personas que contribuyen a Rich Text Area, así como a quienes desarrollan OpenJFX. También agradecemos a los equipos y colaboradores de JUnit y TestFX. Su software libre y su trabajo hacen posible este proyecto. Consulte los avisos de licencia en Ayuda → Licencias.
