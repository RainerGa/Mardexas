name: Bug Report
description: Report a bug or unexpected behavior in Mardexas
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: os
    attributes:
      label: Operating System & Version
      description: e.g. Ubuntu 24.04, Windows 11, macOS Sonoma
      placeholder: e.g. Windows 11
    validations:
      required: true
  - type: dropdown
    id: package_type
    attributes:
      label: Package Type
      description: Which version or package format are you running?
      options:
        - Windows MSI Installer
        - Windows Portable ZIP
        - Linux Flatpak
        - Linux Portable Tarball
        - Linux GraalVM Native Binary
        - macOS Portable App
        - Built from source
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Mardexas
        2. Insert a table with 3 columns
        3. Type ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Drag and drop screenshots or paste console / error logs if applicable.

