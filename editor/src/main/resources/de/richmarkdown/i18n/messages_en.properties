help.title=Help – RichMarkDownEditor
help.header=Markdown and Usage
help.text=MARKDOWN SUPPORT\n\nThe editor follows GitHub Flavored Markdown (GFM), which is based on CommonMark. It implements a supported subset and is not a complete CommonMark or GFM conformance checker.\nGFM specification: https://github.github.com/gfm/\nCommonMark specification: https://spec.commonmark.org/\n\nSupported features include paragraphs and blank lines, headings (# through ######), bold, italic, strikethrough, inline code, links, images, bulleted and numbered lists, nested lists, block quotes, fenced code blocks, horizontal rules, and GFM tables. Underlining is written as an HTML <u> element and is an extension, not part of core GFM.\n\nLINE BREAKS AND BLANK LINES\n\nA single line break between ordinary text lines remains visible in the editor and is saved as a single line break. The editor treats these lines as separate paragraphs internally; other Markdown renderers may display a single break as a soft line break according to GFM.\n\nA blank line separates Markdown blocks. Multiple consecutive empty editor lines are normalized to one Markdown blank line between blocks when saved. Additional blank lines generally do not create extra spacing in Markdown and are therefore not preserved as extra vertical spacing. Markdown has no portable, standardized paragraph-spacing notation for larger visible gaps.\n\nFILES AND FORMATTING\n\nMarkdown files are read and written as UTF-8. Windows and classic Mac line endings are normalized when reading. The editor saves supported formatting as Markdown; unsupported syntax or source formatting may be normalized while editing. For best compatibility, use the elements listed above.
help.languages=LANGUAGES\n\nThe interface is available in German, English, French, Spanish, Brazilian Portuguese, Japanese, Simplified Chinese, Italian, Korean, and Dutch.
