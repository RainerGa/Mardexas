help.title=도움말 – RichMarkDownEditor
help.header=Markdown 및 사용법
help.text=MARKDOWN 지원\n\n편집기는 CommonMark를 기반으로 하는 GitHub Flavored Markdown (GFM)을 따릅니다. 지원되는 일부 기능만 구현하며 CommonMark 또는 GFM 전체 준수 여부를 검사하지 않습니다.\nGFM 사양: https://github.github.com/gfm/\nCommonMark 사양: https://spec.commonmark.org/\n\n문단과 빈 줄, 제목(#부터 ######), 굵게, 기울임꼴, 취소선, 인라인 코드, 링크, 이미지, 글머리 기호 및 번호 매기기 목록, 중첩 목록, 인용, 펜스 코드 블록, 가로줄 및 GFM 표를 지원합니다. 밑줄은 HTML <u> 요소로 기록되는 확장 기능이며 GFM 핵심 사양에는 포함되지 않습니다.\n\n줄 바꿈 및 빈 줄\n\n일반 텍스트 줄 사이의 단일 줄 바꿈은 편집기에 표시되며 저장할 때도 단일 줄 바꿈으로 기록됩니다. 편집기는 이 줄을 내부적으로 별도의 문단으로 처리합니다. 다른 Markdown 렌더러는 GFM에 따라 단일 줄 바꿈을 부드러운 줄 바꿈으로 표시할 수 있습니다.\n\n빈 줄은 Markdown 블록을 구분합니다. 연속된 여러 빈 편집기 줄은 저장 시 블록 사이의 Markdown 빈 줄 하나로 정규화됩니다. Markdown에서는 빈 줄을 더 추가해도 일반적으로 간격이 늘어나지 않으므로 추가 세로 간격으로 보존되지 않습니다. 문단 간격을 늘리는 이식 가능하고 표준화된 Markdown 표기법은 없습니다.\n\n파일 및 서식\n\nMarkdown 파일은 UTF-8로 읽고 씁니다. 읽을 때 Windows 및 기존 Mac 줄 끝은 정규화됩니다. 지원되는 서식은 Markdown으로 저장되며 지원되지 않는 구문이나 원본 서식은 편집 중 정규화될 수 있습니다. 호환성을 높이려면 위에 나열된 요소를 사용하세요.
help.languages=언어\n\n인터페이스는 독일어, 영어, 프랑스어, 스페인어, 브라질 포르투갈어, 일본어, 중국어(간체), 이탈리아어, 한국어 및 네덜란드어로 제공됩니다.
about.title=RichMarkDownEditor 정보
about.header=버전 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nJavaFX용 WYSIWYG Markdown 편집기입니다.\n\n애플리케이션 라이선스: GNU General Public License 버전 3 (GPL-3.0).\n\n런타임 라이브러리:\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls 및 Graphics.\n\n테스트 라이브러리 (개발 및 테스트 전용):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon 및 OpenJFX Monocle 21.0.2\n\nRich Text Area의 Gluon 팀과 모든 기여자, OpenJFX 개발자에게 진심으로 감사드립니다. JUnit 및 TestFX 팀과 기여자에게도 감사드립니다. 이들의 자유 소프트웨어와 노력이 이 프로젝트를 가능하게 합니다. 도움말 → 라이선스에서 라이선스 고지를 확인하세요.
