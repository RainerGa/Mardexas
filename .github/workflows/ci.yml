name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (Java ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java-version: [ 25 ]
    steps:
      - name: Check out source und pinned RichTextArea-Fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Tests ausführen
        run: mvn clean test

      - name: Release checks testen
        run: python3 -B -m unittest discover -s packaging -p test_release_checks.py

      - name: Icon-Herkunft und Lizenzprüfung testen
        run: |
          python3 -B -m unittest discover -s packaging -p test_audit_icons.py
          python3 packaging/audit-icons.py
          python3 -B -m unittest discover -s packaging -p test_audit_emoji.py
          python3 packaging/audit-emoji.py
