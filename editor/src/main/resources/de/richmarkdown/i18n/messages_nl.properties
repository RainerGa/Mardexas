license.text=APPLICATIELICENTIE\n\nRichMarkDownEditor is gelicentieerd onder de GNU General Public License, versie 3 (GPL-3.0). Deze licentie geldt voor de applicatiecode.\nVolledige licentietekst: https://www.gnu.org/licenses/gpl-3.0.html\n\nLICENTIES VAN GEBRUIKTE COMPONENTEN\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls en Graphics)\nGPL-2.0-only met Classpath Exception.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\nOntwikkel- en testafhankelijkheden:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – European Union Public Licence 1.1 (EUPL-1.1), volgens de metadata van de gebruikte artefacten.\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only met Classpath Exception (testafhankelijkheid).\nhttps://openjdk.org/legal/gplv2+ce.html\n\nHERDISTRIBUTIE\n\nBij herdistributie van de editor moeten de voorwaarden van GPL-3.0 en de licenties van alle meegeleverde componenten worden nageleefd. Dit omvat met name het beschikbaar stellen van de volledige corresponderende broncode inclusief wijzigingen en kopieën van licentieteksten en auteursrechtvermeldingen.\n\nDeze kennisgeving is informatief, vormt geen juridisch advies en garandeert niet dat een bepaalde distributievorm aan alle voorwaarden voldoet. Controleer vóór publicatie of herdistributie de volledige licentieteksten, exacte artefacten en distributievorm. De gekoppelde licentieteksten zijn bepalend.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
