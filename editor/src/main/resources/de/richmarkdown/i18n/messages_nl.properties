help.title=Help – RichMarkDownEditor
help.header=Markdown en gebruik
help.text=MARKDOWN-ONDERSTEUNING\n\nDe editor volgt GitHub Flavored Markdown (GFM), dat is gebaseerd op CommonMark. De editor ondersteunt een deelverzameling en controleert niet volledig op conformiteit met CommonMark of GFM.\nGFM-specificatie: https://github.github.com/gfm/\nCommonMark-specificatie: https://spec.commonmark.org/\n\nOndersteunde functies zijn onder meer alinea’s en lege regels, koppen (# tot ######), vet, cursief, doorhalen, inline-code, links, afbeeldingen, lijsten met opsommingstekens en genummerde lijsten, geneste lijsten, citaten, afgebakende codeblokken, horizontale lijnen en GFM-tabellen. Onderstrepen wordt als HTML-element <u> geschreven en is een uitbreiding, geen onderdeel van de GFM-kern.\n\nREGELAFBREKINGEN EN LEGE REGELS\n\nEen enkele regelafbreking tussen gewone tekstregels blijft zichtbaar in de editor en wordt als enkele regelafbreking opgeslagen. De editor behandelt deze regels intern als afzonderlijke alinea’s; andere Markdown-renderers kunnen een enkele afbreking volgens GFM als zachte regelafbreking weergeven.\n\nEen lege regel scheidt Markdown-blokken. Meerdere opeenvolgende lege editorregels worden bij het opslaan genormaliseerd tot één lege Markdown-regel tussen blokken. Extra lege regels zorgen in Markdown doorgaans niet voor meer ruimte en worden daarom niet als extra verticale afstand behouden. Markdown heeft geen draagbare, gestandaardiseerde notatie voor grotere alinea-afstand.\n\nBESTANDEN EN OPMAAK\n\nMarkdown-bestanden worden gelezen en geschreven als UTF-8. Windows- en klassieke Mac-regeleinden worden bij het lezen genormaliseerd. De editor slaat ondersteunde opmaak op; niet-ondersteunde syntaxis of bronopmaak kan tijdens het bewerken worden genormaliseerd. Gebruik voor de beste compatibiliteit de hierboven genoemde elementen.
help.languages=TALEN\n\nDe interface is beschikbaar in het Duits, Engels, Frans, Spaans, Braziliaans-Portugees, Japans, Vereenvoudigd Chinees, Italiaans, Koreaans en Nederlands.
about.title=Over RichMarkDownEditor
about.header=Versie 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nEen WYSIWYG-Markdown-editor voor JavaFX.\n\nApplicatielicentie: GNU General Public License, versie 3 (GPL-3.0).\n\nRuntimebibliotheken:\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls en Graphics.\n\nTestbibliotheken (alleen voor ontwikkeling en tests):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon en OpenJFX Monocle 21.0.2\n\nOnze hartelijke dank gaat uit naar het Gluon-team en alle bijdragers aan Rich Text Area en naar de ontwikkelaars van OpenJFX. Ook bedanken we de teams en bijdragers van JUnit en TestFX. Hun vrije software en werk maken dit project mogelijk. Bekijk de licentievermeldingen onder Help → Licenties.
