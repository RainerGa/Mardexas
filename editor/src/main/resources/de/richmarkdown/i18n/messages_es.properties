license.text=LICENCIA DE LA APLICACIÓN\n\nRichMarkDownEditor está licenciado bajo GNU General Public License, versión 3 (GPL-3.0). Esta licencia se aplica al código de la aplicación.\nTexto completo: https://www.gnu.org/licenses/gpl-3.0.html\n\nLICENCIAS DE LOS COMPONENTES UTILIZADOS\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls y Graphics)\nGPL-2.0-only con Classpath Exception.\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\nDependencias de desarrollo y pruebas:\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – European Union Public Licence 1.1 (EUPL-1.1), según los metadatos de los artefactos utilizados.\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only con Classpath Exception (dependencia de pruebas).\nhttps://openjdk.org/legal/gplv2+ce.html\n\nDISTRIBUCIÓN\n\nAl redistribuir el editor, deben cumplirse las condiciones de GPL-3.0 y las licencias de todos los componentes incluidos. Esto incluye, en particular, proporcionar el código fuente correspondiente completo, incluidas las modificaciones, y copias de los textos de licencia y avisos de copyright.\n\nEste aviso es informativo, no constituye asesoramiento jurídico ni garantiza que un modelo de distribución cumpla todas las condiciones. Antes de publicar o redistribuir, revise los textos completos de las licencias, los artefactos exactos y el modelo de distribución. Prevalecen los textos enlazados.\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
