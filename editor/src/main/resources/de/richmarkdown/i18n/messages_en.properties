about.header=Version 1.0.0
about.text=RichMarkDownEditor 1.0.0\n\nA WYSIWYG Markdown editor for JavaFX.\n\nApplication license: GNU General Public License, Version 3 (GPL-3.0).\n\nRuntime libraries:\n• RichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\n• OpenJFX 25.0.4 – JavaFX Controls and Graphics.\n\nTest libraries (development and testing only):\n• JUnit Jupiter 5.11.3\n• TestFX 4.0.19-gluon and OpenJFX Monocle 21.0.2\n\nOur sincere thanks go to the Gluon team and all contributors to Rich Text Area, as well as the OpenJFX developers. We also thank the JUnit and TestFX teams and contributors. Their free software and work make this project possible. Please see the license notices under “Help → Licensing”.
