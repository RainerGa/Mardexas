license.text=应用许可证\n\nRichMarkDownEditor 根据 GNU General Public License 第 3 版 (GPL-3.0) 授权。此许可证适用于本项目的应用程序代码。\n许可证全文：https://www.gnu.org/licenses/gpl-3.0.html\n\n所用组件的许可证\n\nRichTextArea fork 3.0-RG\nGNU GPL version 3 (GPL-3.0).\nhttps://github.com/gluonhq/rich-text-area\nhttps://www.gnu.org/licenses/gpl-3.0.html\n\nOpenJFX 25.0.4 (Controls 和 Graphics)\nGPL-2.0-only，附带 Classpath Exception。\nhttps://openjdk.org/legal/gplv2+ce.html\nhttps://openjfx.io/\n\n开发和测试依赖项：\nJUnit Jupiter 5.11.3 – Eclipse Public License 2.0 (EPL-2.0)\nhttps://www.eclipse.org/legal/epl-2.0/\n\nTestFX 4.0.19-gluon – 根据所用构件的元数据，采用 European Union Public Licence 1.1 (EUPL-1.1)。\nhttp://ec.europa.eu/idabc/eupl.html\n\nOpenJFX Monocle 21.0.2 – GPL-2.0-only，附带 Classpath Exception（测试依赖项）。\nhttps://openjdk.org/legal/gplv2+ce.html\n\n再分发\n\n再分发本编辑器时，必须遵守 GPL-3.0 条款及所有随附组件的许可证条件。特别是，必须提供包含修改内容的完整对应源代码，以及许可证文本和版权声明的副本。\n\n本声明仅供参考，不构成法律意见，也不保证任何特定分发方式均满足所有条件。发布或再分发前，请审阅完整许可证文本、具体构件和分发方式。链接中的许可证文本具有权威效力。\n\nComplete third-party component and license inventory: THIRD-PARTY-NOTICES.md
